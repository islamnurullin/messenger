name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Отменяем предыдущий прогон той же ветки: в CI имеет смысл только последний коммит.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Бэкенд — линтер и тесты
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: messenger
          POSTGRES_USER: messenger
          POSTGRES_PASSWORD: messenger
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U messenger -d messenger"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ci-insecure-key-not-for-production
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_DB: messenger
      POSTGRES_USER: messenger
      POSTGRES_PASSWORD: messenger
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Установка зависимостей
        run: pip install -r requirements-dev.txt

      - name: Линтер
        run: |
          ruff check .
          ruff format --check .

      - name: Проверка конфигурации Django
        run: python manage.py check --deploy --fail-level WARNING
        continue-on-error: true   # --deploy ругается на dev-настройки, это ожидаемо

      - name: Нет несозданных миграций
        run: python manage.py makemigrations --check --dry-run

      - name: Тесты
        run: pytest --cov --cov-report=term-missing

  frontend:
    name: Веб — проверка типов и линтер
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Установка зависимостей
        run: npm ci

      - name: Проверка типов
        run: npm run check

      - name: Линтер и форматирование
        run: npm run lint

      - name: Сборка
        run: npm run build

  compose:
    name: Инфраструктура — конфиг валиден
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверка docker-compose
        run: docker compose -f infra/docker-compose.yml config --quiet
